name: ci

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verificación
        run: bash scripts/verificar.sh
      - name: Evidencia de calidad
        env:
          SECRET_KEY: verificacion-ci-sin-secreto-de-produccion-2026
        run: python scripts/verificar_calidad.py
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: evidencia-calidad
          path: var/
