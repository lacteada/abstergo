name: ci

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Dependencias
        run: pip install -r requirements.txt pytest pytest-django ruff
      - name: Verificación
        run: bash scripts/verificar.sh
