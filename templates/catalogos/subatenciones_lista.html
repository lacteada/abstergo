{% extends "listado.html" %}

{% block encabezado %}
  <th>#</th>
  <th>Nombre</th>
  <th>Tipo de Atención</th>
  <th>Acciones</th>
{% endblock %}

{% block fila %}
  <td>{{ fila.id }}</td>
  <td>{{ fila.nombre }}</td>
  <td>{{ fila.tipo_atencion }}</td>
  <td class="acciones">
    <ul class="acciones-lista">
      <li><a class="accion accion-icono" href="{% url 'catalogos:subatenciones_editar' fila.pk %}" data-modal title="Editar" aria-label="Editar">{% include 'iconos/editar.html' %}</a></li>
      <li><a class="accion accion-icono peligro" href="{% url 'catalogos:subatenciones_eliminar' fila.pk %}" data-eliminar title="Eliminar" aria-label="Eliminar">{% include 'iconos/eliminar.html' %}</a></li>
    </ul>
  </td>
{% endblock %}
