{% extends "base.html" %}

{% block contenido %}

  <h1 class="titulo">{{ titulo }}</h1>

  <p class="aviso">
    ¿Confirmas dar de baja <strong>{{ object }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="botonera">
      <button class="btn-muni btn-icono" type="submit" title="Eliminar" aria-label="Eliminar">
        {% include 'iconos/eliminar.html' %}
      </button>
      <a class="btn-icono" href="{% url url_listado %}" title="Cancelar" aria-label="Cancelar">
        {% include 'iconos/cancelar.html' %}
      </a>
    </div>
  </form>

{% endblock %}
