{% extends "base.html" %}

{% block titulo %}{{ titulo }} · Sistema Municipal{% endblock %}

{% block contenido %}

  <nav class="migas" aria-label="Ruta de navegación">
    <a href="{% url 'panel:inicio' %}">Inicio</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">{{ titulo }}</span>
  </nav>

  <div class="cabecera">
    <h1 class="titulo">{{ titulo }}</h1>
    <a class="btn-muni btn-icono" href="{% url url_listado %}"
       title="Volver al listado" aria-label="Volver al listado">
      {% include 'iconos/anterior.html' %}
    </a>
  </div>
  {% if subtitulo %}<p class="subtitulo">{{ subtitulo }}</p>{% endif %}

  <div class="ficha">
    {% include "partials/consulta.html" %}
  </div>

{% endblock %}
