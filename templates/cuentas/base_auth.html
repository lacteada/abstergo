<html lang="es">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{% static 'css/frameworkV1.css' %}">
  <link rel="stylesheet" href="{% static 'css/institucional.css' %}">
</head>
<body class="auth">

  <div class="auth-tarjeta">

    {% block contenido %}{% endblock %}

</body>
</html>
