{% extends "base.html" %}

{% block contenido %}

  <div class="cabecera">
    <h1 class="titulo">{{ titulo }}</h1>
    <a class="boton" href="{% url 'sgr:global' %}">Vista global por cargos</a>
  </div>

  <div class="barra">
    <form class="buscador" method="get">
      <label for="periodo">Período</label>
      <select name="periodo" id="periodo" onchange="this.form.submit()">
        {% for periodo in periodos %}
          <option value="{{ periodo.pk }}" {% if resumen.periodo and resumen.periodo.pk == periodo.pk %}selected{% endif %}>{{ periodo.nombre }}</option>
        {% endfor %}
      </select>
    </form>
  </div>

  {% include "sgr/partials/tablero_tabla.html" %}

{% endblock %}
